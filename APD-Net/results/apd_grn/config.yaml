seed: 42
image_size: 256
batch_size: 4
num_workers: 4
epochs: 20
learning_rate: 0.0002
base_channels: 32
num_classes: 2
segmentor_channels:
- 16
- 32
- 64
- 128
- 256
noise:
  model: gaussian
  train_sigma_min: 0.05
  train_sigma_max: 0.3
  evaluation_sigmas:
  - 0.05
  - 0.1
  - 0.15
  - 0.2
  - 0.25
  - 0.3
  evaluation_seed: 4200
ablation:
  spatial_branch: true
  frequency_branch: true
  anatomy_attention: true
  edge_head: true
  edge_feedback: true
  edge_supervision: true
  segmentation_feedback: true
  patchgan: true
loss:
  lambda_restore: 1.0
  lambda_l1: 1.0
  lambda_ssim: 1.0
  lambda_frequency: 0.1
  lambda_edge: 1.0
  lambda_edge_dice: 1.0
  edge_positive_weight: 20.0
  lambda_seg: 1.0
  lambda_seg_ce: 1.0
  segmentation_foreground_weight: 20.0
  lambda_adv: 0.01
  edge_target_mode: annotation
data:
  train_split: ../HC18_Research/splits/train.csv
  val_split: ../HC18_Research/splits/val.csv
checkpoint: checkpoints/apd_grn_best.pt
initialize_generator_from: checkpoints/apd_stage1_best.pt
results_dir: results/apd_grn
checkpoint_selection_sigma: 0.2
example_sigma: 0.2
num_visual_examples: 5
