seed: 42
image_size: 256
batch_size: 8
num_workers: 4
learning_rate: 0.0002
epochs: 80
early_stopping_patience: 12
segmentor_channels: [16, 32, 64, 128, 256]
target_modes: [contour, filled_mask]
segmentation_target: contour
foreground_weights:
  contour: 20.0
  filled_mask: 1.0
thresholds: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90]
boundary_tolerances: [1, 2, 3, 5]
split:
  train: ../HC18_Research/splits/train.csv
  validation: ../HC18_Research/splits/val.csv
filled_mask_cache: results/diagnostics/derived_filled_masks_256
output_dir: results/diagnostics/segmentors
checkpoint_dir: checkpoints/diagnostics