seed: 42
image_size: 256
batch_size: 4
num_workers: 4
epochs: 20
early_stopping_patience: 20
learning_rate: 0.00005
base_channels: 32
noise:
  sigma_min: 0.05
  sigma_max: 0.30
  validation_sigma: 0.20
  validation_seed: 4200
  evaluation_sigmas: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30]
loss:
  lambda_l1: 1.0
  lambda_ssim: 1.0
  lambda_frequency: 0.1
  lambda_edge: 1.0
  lambda_edge_dice: 1.0
  edge_positive_weight: 20.0
initialize_from: checkpoints/diagnostics/best_apd_reconstruction.pt
checkpoint: checkpoints/diagnostics/best_apd_reconstruction_fair.pt
results_dir: results/diagnostics/apd_reconstruction_fair
data:
  train_split: ../HC18_Research/splits/train.csv
  val_split: ../HC18_Research/splits/val.csv