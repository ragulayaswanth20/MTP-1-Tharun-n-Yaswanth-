seed: 42
image_size: 256
batch_size: 8
num_workers: 4
epochs: 30
early_stopping_patience: 8
learning_rate: 0.0001
base_channels: 32
noise:
  sigma_min: 0.05
  sigma_max: 0.30
  validation_sigma: 0.20
  validation_seed: 4200
  evaluation_sigmas: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30]
loss:
  lambda_l1: 1.0
  lambda_ssim: 1.0
  lambda_frequency: 0.1
  lambda_edge: 0.5
  lambda_edge_dice: 1.0
  edge_positive_weight: 20.0
initialize_from: checkpoints/apd_stage1_best.pt
checkpoint: checkpoints/diagnostics/best_apd_reconstruction.pt
results_dir: results/diagnostics/apd_reconstruction
data:
  train_split: ../HC18_Research/splits/train.csv
  val_split: ../HC18_Research/splits/val.csv