[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hc18-research"
version = "0.1.0"
description = "Reproducible HC-18 fetal ultrasound denoising research project"
requires-python = ">=3.10"
dependencies = ["numpy", "Pillow", "torch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
